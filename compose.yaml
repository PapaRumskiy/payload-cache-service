# Local deployment: Postgres, a one-off migration run, then the API.

x-app: &app
  build: .
  image: payload-cache-service
  environment:
    CACHE_SERVICE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cache}:${POSTGRES_PASSWORD:-cache}@db:5432/${POSTGRES_DB:-cache}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cache}
      POSTGRES_DB: ${POSTGRES_DB:-cache}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs once and exits; the API starts only after the schema is up to date.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
